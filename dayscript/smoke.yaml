# A dayscript smoke test (https://daybrite.dev/docs/dayscript): drives the running app by
# element id and route, on any target. Run it with:
#
#     day launch -p ios-uikit --script dayscript/smoke.yaml
#
flow:
  # The home grid mounts immediately on every platform.
  - wait_for: { id: home }
  - assert_visible: { id: tile-breakout }

  # A tile tap presents the game in the fullscreen cover.
  - tap: { id: tile-breakout }
  - pause: { secs: 0.6 }
  - assert_visible: { id: bk-canvas }
  - assert_route: { route: breakout }

  # The X in the top-leading corner is the way out.
  - tap: { id: close-game }
  - pause: { secs: 0.6 }
  - assert_visible: { id: tile-sirtet }

  # Covers are route surfaces too: navigate presents, nav_back dismisses.
  - navigate: { route: twentyfortyeight }
  - pause: { secs: 0.6 }
  - assert_visible: { id: tf-canvas }
  - nav_back:
  - pause: { secs: 0.6 }

  - navigate: { route: blockblast }
  - pause: { secs: 0.6 }
  - assert_visible: { id: bb-canvas }
  - nav_back:
  - pause: { secs: 0.6 }

  - navigate: { route: solitaire }
  - pause: { secs: 0.6 }
  - assert_visible: { id: sol-canvas }
  - nav_back:
  - pause: { secs: 0.6 }

  - screenshot: smoke
