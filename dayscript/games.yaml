# Gameplay sweep for screenshots. Run with `--env DAY_GAMES_SEED=15` so the Sudoku cells it
# taps are empty (see dayscript/sudoku.yaml).
name: games
flow:
  - wait_for: { id: home }
  - screenshot: home
  # Every game opens its rules by itself the first time it is played; opening each once
  # first makes the sweep below the same from any saved state.
  - navigate: { route: breakout }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: sirtet }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: twentyfortyeight }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: breakout }
  - pause: { secs: 0.6 }
  - tap: { id: bk-canvas }
  - pause: { secs: 0.9 }
  - screenshot: breakout-a
  - pause: { secs: 0.7 }
  - screenshot: breakout-b
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: sirtet }
  - pause: { secs: 0.5 }
  - tap: { id: st-canvas }
  - tap: { id: st-canvas }
  - pause: { secs: 0.4 }
  - screenshot: sirtet-a
  - pause: { secs: 1.0 }
  - screenshot: sirtet-b
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: twentyfortyeight }
  - pause: { secs: 0.6 }
  - screenshot: g2048
  # New Game asks for the rules; Easy adds the undo button beside pause.
  - tap: { id: tf-pause }
  - pause: { secs: 0.4 }
  - tap: { id: tf-new-game }
  - pause: { secs: 0.4 }
  - assert_visible: { id: tf-difficulty-picker }
  - screenshot: g2048-difficulty
  - tap: { id: tf-diff-easy }
  - pause: { secs: 0.5 }
  - assert_visible: { id: tf-undo }
  - screenshot: g2048-easy
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: sudoku }
  - pause: { secs: 0.8 }
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: sudoku }
  - pause: { secs: 0.8 }
  - tap: { id: su-cell-40 }
  - tap: { id: su-key-5 }
  - pause: { secs: 0.4 }
  - screenshot: sudoku
  - nav_back: {}
