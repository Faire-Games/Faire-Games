name: ci

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *" # daily (UTC)

permissions:
  contents: write # release-asset upload on tag builds
  pages: write    # web-dom → GitHub Pages (deploy-web)
  id-token: write # deploy-pages OIDC token (deploy-web)

jobs:
  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    secrets: inherit
    with:
      # The eight targets Day.toml declares.
      targets: windows-xaml, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      # main until the next day release: the flatpak/MSIX default-icon fallback (needed by apps
      # without resource/icons/, like this one) is newer than the latest published CLI.
      day-version: main
      # Named rather than "auto": smoke.yaml asserts navigation and the cover routes on every
      # target, and games.yaml sweeps every game for the screenshots the website's gallery
      # publishes (bk.yaml is a local Breakout sweep).
      scripts: dayscript/smoke.yaml dayscript/games.yaml
      # Pins every game's RNG so a scripted run meets the same puzzle and layout everywhere.
      launch-env: DAY_GAMES_SEED=15
      # website/site.toml makes the workflow build and deploy the full project site
      # (https://daybrite.github.io/Day-Games/) from the daybrite/daysite template on every push
      # to main, with the web build hosted at /Day-Games/webapp/. deploy-web stays on as the
      # fallback: were website/ ever removed, the bare web app would return to the Pages root.
      deploy-web: true
      daysite-version: main
