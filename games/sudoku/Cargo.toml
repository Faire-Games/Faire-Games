[package]
name = "sudoku"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# A COMPOSITE Day piece: a reusable widget built PURELY from Day's core primitives — no native /
# per-backend code and NO cargo features, so it works on every backend for free. Depend on it with a
# plain `{ workspace = true }` (or git) line and call the builder from `use day::prelude::*` code.

[dependencies]
day-pieces = { path = "../../../day/crates/day-pieces" }
day-core = { path = "../../../day/crates/day-core" }
day-reactive = { path = "../../../day/crates/day-reactive" }
day-spec = { path = "../../../day/crates/day-spec" }
day-fluent = { path = "../../../day/crates/day-fluent" }
# Haptic feedback per move, behind the game's Vibrations setting (a no-op where the platform
# has no engine).
day-part-haptics = { path = "../../../day/parts/day-part-haptics" }
gamekit = { path = "../../gamekit" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
