[package]
name = "sudoku"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

# A composite Day piece: a reusable widget built purely from Day's core primitives, with no native
# per-backend code and no cargo features, so it works on every backend as is. Depend on it with a
# plain `{ workspace = true }` (or git) line and call the builder from `use day::prelude::*` code.

[dependencies]
day-pieces = { git = "https://github.com/daybrite/day.git" }
day-core = { git = "https://github.com/daybrite/day.git" }
day-reactive = { git = "https://github.com/daybrite/day.git" }
day-spec = { git = "https://github.com/daybrite/day.git" }
day-fluent = { git = "https://github.com/daybrite/day.git" }
# Haptic feedback per move, behind the game's Vibrations setting (a no-op where the platform
# has no engine).
gamekit = { path = "../../gamekit" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
