<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app-icon master for the `appfair` flavor (https://daybrite.dev/docs/icons): the icon
       Fair Games already ships on the App Store and Google Play, drawn as vector so `day icon
       build` can render every size and the Android adaptive and themed layers from it. The grid,
       the two pinks and the background gradient are measured from the 1024px icon of the app
       being replaced — see README.md beside this file. Top-level ids mark the semantic layers:
         day:background  — the full-bleed backdrop (Android adaptive background)
         day:foreground  — the motif (Android adaptive foreground, safe-zone scaled)
         day:monochrome  — the tinted silhouette (hidden in plain viewers) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241C44"/>
      <stop offset="1" stop-color="#0C081F"/>
    </linearGradient>
  </defs>
  <rect id="day:background" width="1024" height="1024" fill="url(#bg)"/>
  <g id="day:foreground" transform="translate(-27 -27)">
