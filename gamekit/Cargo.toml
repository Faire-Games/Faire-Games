[package]
name = "gamekit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The games' shared save-state mechanism: serde_json snapshots in day-part-prefs, written on
# game exit (scope cleanup) and on app backgrounding (lifecycle phases where delivered).

[dependencies]
day-core = { path = "../../day/crates/day-core" }
day-reactive = { path = "../../day/crates/day-reactive" }
day-spec = { path = "../../day/crates/day-spec" }
day-part-prefs = { path = "../../day/parts/day-part-prefs" }
# The shared game chrome (`chrome`): composed from Day's core pieces, localized through
# Fluent, with haptics behind each game's Vibrations setting.
day-pieces = { path = "../../day/crates/day-pieces" }
day-fluent = { path = "../../day/crates/day-fluent" }
day-part-haptics = { path = "../../day/parts/day-part-haptics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The web build has no `SystemTime`; `seed()` draws browser entropy through the getrandom
# bridge day-dom already answers (docs/web.md).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false }
