[package]
name = "day-games"
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
# Generates typed resource constants (`res::images::…`, `res::assets::…`, `res::fonts::…`) from the
# files under `resource/` on every build; see build.rs and src/lib.rs (§18.5).
build = "build.rs"

# One backend feature per toolkit; `day build`/`day launch` pass the real one per target
# (`--no-default-features --features <backend>`). `mock` is the default so bare `cargo` and
# rust-analyzer link.
[features]
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
mdc = ["day/mdc"]
xaml = ["day/xaml"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests the iOS staticlib / Android cdylib
# explicitly via `cargo rustc --crate-type` (a desktop cdylib blows past the windows-gnu PE
# export cap).
[lib]
# A constant name, not the package's. Every artifact Day stages is named after the LIB target
# (`libdayapp.a` for the iOS/macOS staticlib, `libdayapp.so` for the Android cdylib, and the
# `dayapp::` path `src/main.rs` imports), so none of them move when the package is renamed.
# Renaming this app is a one-line edit to `[package] name` above (DESIGN.md §17.5).
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# The day framework resolves from git (the crates aren't on crates.io yet), here and in every
# game crate. Local development against a checkout goes through the gitignored
# .cargo/config.toml [patch] that `day patch --local ../day` writes; CI has no such file.
day = { git = "https://github.com/daybrite/day.git" }
blockblast = { path = "games/blockblast" }
breakout = { path = "games/breakout" }
charades = { path = "games/charades" }
mines = { path = "games/mines" }
reversi = { path = "games/reversi" }
pipes = { path = "games/pipes" }
gamekit = { path = "gamekit" }
sirtet = { path = "games/sirtet" }
solitaire = { path = "games/solitaire" }
sudoku = { path = "games/sudoku" }
twentyfortyeight = { path = "games/twentyfortyeight" }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }

# Solitaire proves each new deal winnable by searching tens of thousands of positions, which an
# unoptimized build does dozens of times slower; debug builds and walkthroughs optimize that crate.
[profile.dev.package.solitaire]
opt-level = 3


[workspace]
resolver = "2"
members = [
    ".",
    "games/blockblast",
    "games/breakout",
    "games/charades",
    "games/mines",
    "games/reversi",
    "games/pipes",
    "games/sirtet",
    "games/solitaire",
    "games/sudoku",
    "games/twentyfortyeight",
    "gamekit",
]
