  <!-- The app-icon master (docs/icons.md). `day icon` renders every platform's icon set from
       this one file. Top-level ids mark semantic layers:
         day:background  — the full-bleed backdrop (Android adaptive background)
         day:foreground  — the motif (Android adaptive foreground, safe-zone scaled)
         day:monochrome  — the tinted/themed silhouette (hidden in plain viewers)
       Outlined shapes only: `day icon` shapes no text. -->
