      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect id="day:background" width="1024" height="1024" fill="url(#bg)"/>
  <rect id="day:foreground-glow" width="1024" height="1024" fill="url(#glow)"/>
